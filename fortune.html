<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fortune Cookie · For Erabeee</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div id="bg-sky"></div>

<header class="top-nav">
  <a class="nav-home" href="index.html" aria-label="Home">🏠</a>
  <div class="nav-stage">Stage <span>7</span> of 9 · Fortune Cookie</div>
  <button class="nav-music" id="music-toggle" title="Toggle music">🔇</button>
</header>
<div class="progress-track"><div class="progress-fill" style="width:77%;"></div></div>

<main>
  <div class="card">
    <div class="eyebrow">🍀 Fortune Cookie</div>
    <h2>Crack one open, Erabeee</h2>
    <div style="font-size:60px; cursor:pointer; margin:14px 0;" onclick="playClick(); crackFortune();" id="cookie-emoji">🥠</div>
    <div class="message-box script" id="fortune-text" style="min-height:60px;"></div>
  </div>

  <div class="stage-footer-nav">
    <a class="btn secondary" href="memories.html">← Back</a>
    <a class="btn ghost" href="index.html">Map</a>
    <a class="btn" href="games.html">Next: Mini Games →</a>
  </div>
</main>

<footer>
  <p class="script" style="font-size:22px;">Made with endless warmth, just for Erabeee 💖</p>
  <button id="secret-heart" title="...">💗</button>
</footer>

<div id="modal-overlay">
  <div id="modal-box">
    <button id="modal-close" aria-label="Close">✕</button>
    <p id="modal-text"></p>
  </div>
</div>

<script src="assets/script.js"></script>
<script>
const fortunes = [
  "A wonderful surprise is waiting for you, Erabeee.",
  "Today will become better than you expect.",
  "Keep smiling — it suits you.",
  "Something small will make you laugh out loud today.",
  "You are exactly where you need to be right now."
];
function crackFortune(){
  document.getElementById('cookie-emoji').textContent = '🍪';
  document.getElementById('fortune-text').textContent = pick(fortunes);
  setTimeout(()=> document.getElementById('cookie-emoji').textContent = '🥠', 2200);
}
</script>
</body>
</html>
